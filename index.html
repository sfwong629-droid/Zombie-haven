</div><script>
const c=document.getElementById("game"),g=c.getContext("2d");g.imageSmoothingEnabled=false;
let W,H,DPR,tick=0,sel=null,TW=42,TH=21;
const COLS=16,ROWS=20,BUILD={x0:2,y0:6,x1:13,y1:17};
const cam={x:0,y:-25,z:1}; let pointers=new Map(), gesture=null, tapStart=null;
const defs={
 farm:{name:"Farm",cost:300,mat:4,w:2,h:2,q:10,a:5},
 water:{name:"Water Collector",cost:250,mat:3,w:2,h:2,q:10,a:4},
 canteen:{name:"Canteen",cost:450,mat:5,w:2,h:2,q:10,a:10},
 armory:{name:"Armory",cost:800,mat:8,w:2,h:2,q:10,a:12},
 house:{name:"House",cost:350,mat:4,w:2,h:2,q:10,a:8}
};
const weapons=[["Pipe",6,0],["Knife",9,45],["Bat",14,75],["Machete",19,120],["Pistol",24,180]];
const S={money:1800,food:12,water:12,mat:24,ren:0,day:1,hour:8,kills:0,stage:0,b:[],sv:[],z:[]},floats=[];
function resize(){let r=world.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*DPR;c.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);TW=Math.max(38,Math.min(46,W/9.2));TH=TW/2;if(!cam.inited){cam.x=0;cam.y=-35;cam.z=Math.min(1.08,W/390);cam.inited=1}} addEventListener("resize",resize);resize();
function baseIso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function center(){return{x:W/2,y:45}}
function iso(x,y){let b=baseIso(x,y),cc=center();return{x:cc.x+cam.x+b.x*cam.z,y:cc.y+cam.y+b.y*cam.z}}
function worldPoint(x,y){let b=baseIso(x,y);return{x:b.x,y:b.y}}
function scr(w){let cc=center();return{x:cc.x+cam.x+w.x*cam.z,y:cc.y+cam.y+w.y*cam.z}}
function inv(px,py){let cc=center();let wx=(px-cc.x-cam.x)/cam.z,wy=(py-cc.y-cam.y)/cam.z;let a=wx/(TW/2),b=wy/(TH/2);return{x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,fill,edge="#365536"){let p=iso(x,y),hw=TW/2*cam.z,hh=TH/2*cam.z;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+hw,p.y+hh);g.lineTo(p.x,p.y+2*hh);g.lineTo(p.x-hw,p.y+hh);g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=edge;g.lineWidth=Math.max(1,cam.z);g.stroke()}
function pxrect(x,y,w,h,col,edge){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(edge){g.fillStyle=edge;g.fillRect(x-1,y-1,w+2,h+2)}g.fillStyle=col;g.fillRect(x,y,w,h)}
function footprintFree(x,y,d,ignore=null){if(x<BUILD.x0||y<BUILD.y0||x+d.w-1>BUILD.x1||y+d.h-1>BUILD.y1)return false;return !S.b.some(b=>b!==ignore&&x<b.x+b.w&&x+d.w>b.x&&y<b.y+b.h&&y+d.h>b.y)}
function tileCenter(x,y){return worldPoint(x+.5,y+.5)}
function buildCenter(b){return worldPoint(b.x+b.w/2,b.y+b.h/2)}
function tree(x,y){let p=iso(x,y),z=cam.z;pxrect(p.x-2*z,p.y-13*z,4*z,13*z,"#6a4a2d","#332719");pxrect(p.x-9*z,p.y-23*z,18*z,9*z,"#2e7c3c","#174e2a");pxrect(p.x-6*z,p.y-29*z,12*z,9*z,"#49a64c","#174e2a")}
function crateAt(x,y){let p=iso(x,y),z=cam.z;pxrect(p.x-6*z,p.y-8*z,12*z,9*z,"#a46a31","#4a301c")}
function building(b,ghost=false,ok=true){
 let p=scr(buildCenter(b)),z=cam.z, w=30*z+(b.w-1)*10*z, h=24*z+(b.h-1)*3*z;
 g.save();if(ghost)g.globalAlpha=.68;
 // ground pad makes the building visibly sit on the tile plane
 let left=iso(b.x,b.y+b.h),right=iso(b.x+b.w,b.y),top=iso(b.x,b.y),bot=iso(b.x+b.w,b.y+b.h);
 g.beginPath();g.moveTo(top.x,top.y+TH*z/2);g.lineTo(right.x,right.y+TH*z/2);g.lineTo(bot.x,bot.y+TH*z/2);g.lineTo(left.x,left.y+TH*z/2);g.closePath();g.fillStyle=ghost?(ok?"#62c56b":"#d34d49"):"#bfa66c";g.fill();g.strokeStyle="#624d2f";g.stroke();
 let roof="#c35b32",front="#d99b58",side="#9d623e",name=defs[b.type].name;
 if(b.type==="water"){roof="#5b93ad";front="#4f7585";side="#395966"}
 if(b.type==="armory"){roof="#586a70";front="#687b78";side="#45585a"}
 if(b.type==="canteen"){roof="#c67a3a";front="#d69b55";side="#9c6339"}
 if(b.type==="farm"){
   for(let yy=0;yy<b.h;yy++)for(let xx=0;xx<b.w;xx++){let q=iso(b.x+xx+.5,b.y+yy+.5);pxrect(q.x-7*z,q.y-2*z,14*z,5*z,"#6e8e3c");pxrect(q.x-4*z,q.y-7*z,3*z,6*z,"#4cad45");pxrect(q.x+2*z,q.y-6*z,3*z,5*z,"#75bd46")}
 } else if(b.type==="water"){
   pxrect(p.x-11*z,p.y-34*z,22*z,25*z,front,"#263d43");pxrect(p.x-8*z,p.y-30*z,16*z,4*z,"#8bc1ce");pxrect(p.x-9*z,p.y-8*z,3*z,15*z,"#463b2b");pxrect(p.x+6*z,p.y-8*z,3*z,15*z,"#463b2b")
 } else {
   // compact chibi-scale isometric building
   g.fillStyle=front;g.beginPath();g.moveTo(p.x-w/2,p.y-h);g.lineTo(p.x,p.y-h+w*.22);g.lineTo(p.x,p.y+2*z);g.lineTo(p.x-w/2,p.y-w*.22+2*z);g.closePath();g.fill();
   g.fillStyle=side;g.beginPath();g.moveTo(p.x+w/2,p.y-h);g.lineTo(p.x,p.y-h+w*.22);g.lineTo(p.x,p.y+2*z);g.lineTo(p.x+w/2,p.y-w*.22+2*z);g.closePath();g.fill();
   g.fillStyle=roof;g.beginPath();g.moveTo(p.x,p.y-h-w*.22);g.lineTo(p.x+w/2,p.y-h);g.lineTo(p.x,p.y-h+w*.22);g.lineTo(p.x-w/2,p.y-h);g.closePath();g.fill();g.strokeStyle="#54321f";g.stroke();
   pxrect(p.x-4*z,p.y-10*z,8*z,12*z,"#573522","#2a2119");pxrect(p.x-15*z,p.y-14*z,7*z,6*z,"#8ed1df","#3b5360")
 }
 if(!ghost){g.fillStyle="#fff3b3";g.font=`bold ${Math.max(6,7*z)}px Arial`;g.textAlign="center";g.fillText(name.toUpperCase(),p.x,p.y+15*z)}
 g.restore()
}
function bar(x,y,r,col,z=cam.z){g.fillStyle="#1a1715";g.fillRect(x-10*z,y,20*z,4*z);g.fillStyle=col;g.fillRect(x-9*z,y+z,18*z*Math.max(0,r),2*z)}
function human(s){
 let p=scr(s.w),z=cam.z,bob=Math.sin((tick+s.phase)/13)*1.1*z,step=s.moving?Math.sin((tick+s.phase)/4)*2*z:0,x=p.x,y=p.y+bob;
 g.fillStyle="#26301f";g.fillRect(x-6*z,y+7*z,12*z,3*z);
 let skin=s.i===1?"#e3a47c":"#bd865e", shirt=s.i===0?"#3678a4":s.i===1?"#d05d6f":"#d79b37";
 pxrect(x-4*z,y-15*z,8*z,7*z,skin,"#3a2921");pxrect(x-5*z,y-8*z,10*z,10*z,shirt,"#28302d");
 pxrect(x-5*z,y+2*z+step,4*z,7*z,"#34424c","#222");pxrect(x+1*z,y+2*z-step,4*z,7*z,"#34424c","#222");
 if(s.i===0)pxrect(x-5*z,y-17*z,10*z,3*z,"#294e68");
 if(s.mode==="windup"||s.mode==="recover")pxrect(x+5*z,y-6*z,10*z,2*z,"#d7c26f","#433");
 bar(x,y-20*z,s.hp/s.max,"#71c75b",z);g.fillStyle="#fff5bd";g.font=`bold ${Math.max(7,8*z)}px Arial`;g.textAlign="center";g.fillText(s.name,x,y+19*z)
}
function zombie(zm){
 let p=scr(zm.w),z=cam.z,bob=Math.sin((tick+zm.phase)/11)*1.2*z,x=p.x,y=p.y+bob;
 g.fillStyle="#22291e";g.fillRect(x-6*z,y+7*z,12*z,3*z);pxrect(x-4*z,y-15*z,8*z,7*z,"#829766","#35432e");pxrect(x-5*z,y-8*z,10*z,10*z,"#69534a","#2e2925");pxrect(x-5*z,y+2*z,4*z,7*z,"#3a3b34");pxrect(x+1*z,y+2*z,4*z,7*z,"#3a3b34");bar(x,y-20*z,zm.hp/zm.max,"#d64f48",z)
}
function mk(name,job,l,x,y,i){return{name,job,l,w:tileCenter(x,y),hp:58+l*8,max:58+l*8,money:140,weapon:weapons[0],mode:"wander",target:null,cool:20+i*23,sat:0,i,phase:i*37,dest:null,moving:false}}
function spawn(x=null,y=null){let choices=[[2,2],[6,2],[10,2],[13,3],[1,5]];let a=choices[Math.floor(Math.random()*choices.length)];S.z.push({w:tileCenter(x??a[0],y??a[1]),hp:30,max:30,cool:35+Math.random()*40,phase:Math.random()*100,dest:null})}
function moveW(o,t,s){let dx=t.x-o.w.x,dy=t.y-o.w.y,d=Math.hypot(dx,dy);o.moving=d>1;if(d<s){o.w.x=t.x;o.w.y=t.y;o.moving=false;return true}o.w.x+=dx/d*s;o.w.y+=dy/d*s;return false}
function nearestZombie(s){let live=S.z.filter(z=>z.hp>0);if(!live.length)return null;live.sort((a,b)=>Math.hypot(s.w.x-a.w.x,s.w.y-a.w.y)-Math.hypot(s.w.x-b.w.x,s.w.y-b.w.y));let top=live.slice(0,Math.min(3,live.length));return top[(s.i+Math.floor(tick/150))%top.length]}
function roamDest(s){let x=BUILD.x0+1+Math.random()*(BUILD.x1-BUILD.x0-2),y=BUILD.y0+1+Math.random()*(BUILD.y1-BUILD.y0-2);return tileCenter(x,y)}
function ai(s){
 if(s.cool>0)s.cool--;
 if(s.hp<=0){s.w=tileCenter(7,6);s.hp=s.max*.6;s.mode="rest";s.cool=160;say(s.name+" was rescued.");return}
 if(s.mode==="rest"){s.moving=false;if(s.cool<=0){s.hp=s.max;s.mode="wander";s.cool=20}return}
 if(s.mode==="wander"){
   if(!s.dest||s.cool<=0){s.dest=roamDest(s);s.cool=100+Math.random()*130}
   if(s.dest&&moveW(s,s.dest,.34)) {s.dest=null;s.cool=25+Math.random()*55}
   let z=nearestZombie(s), d=z?Math.hypot(s.w.x-z.w.x,s.w.y-z.w.y):999;
   if(z && (d<145 || Math.random()<.004)){s.target=z;s.mode="chase";s.cool=0}
   return
 }
 if((!s.target||s.target.hp<=0)&&["chase","windup","recover"].includes(s.mode)){s.target=nearestZombie(s);if(!s.target){s.mode="wander";return}else s.mode="chase"}
 if(s.mode==="chase"){let d=Math.hypot(s.w.x-s.target.w.x,s.w.y-s.target.w.y);if(d>20)moveW(s,s.target.w,.48);else{s.moving=false;s.mode="windup";s.cool=28+s.i*5}return}
 if(s.mode==="windup"){s.moving=false;if(s.cool<=0){let z=s.target;if(z&&z.hp>0){let dmg=Math.round(6+s.weapon[1]*.55);z.hp-=dmg;floats.push({w:{...z.w},t:"-"+dmg,col:"#ffe06b",a:55});if(z.hp<=0){S.kills++;s.money+=18;S.money+=4;S.ren++;say(s.name+" defeated a Walker!");if(S.stage===1&&S.kills>=3){S.stage=2;S.ren+=10;say("Goal complete! Renown +10")}}}s.mode="recover";s.cool=38+s.i*7}return}
 if(s.mode==="recover"){if(s.cool<=0){s.target=nearestZombie(s);s.mode=s.target?"chase":"wander"}return}
}
function zai(z){z.cool=Math.max(0,z.cool-1);if(!z.dest||Math.random()<.006)z.dest={x:z.w.x+(Math.random()-.5)*28,y:z.w.y+(Math.random()-.5)*14};if(z.dest)moveW(z,z.dest,.07);let near=S.sv.filter(s=>s.hp>0&&Math.hypot(s.w.x-z.w.x,s.w.y-z.w.y)<22);if(near.length&&z.cool<=0){let s=near[Math.floor(Math.random()*near.length)];s.hp-=4;floats.push({w:{...s.w},t:"-4",col:"#ff6e62",a:55});z.cool=70}}
function init(){
 S.b=[{type:"canteen",x:5,y:9,w:2,h:2,q:10,a:10},{type:"house",x:9,y:11,w:2,h:2,q:10,a:8}];
 S.sv=[mk("Marcus","Guard",3,6,12,0),mk("Amy","Medic",2,9,13,1),mk("Lena","Scavenger",2,4,14,2)];
 spawn(5,3);spawn(9,3);spawn(12,4);
 Object.entries(defs).forEach(([k,d])=>{let b=document.createElement("button");b.className="build";b.innerHTML=`${d.name} · ${d.w}×${d.h}<small>$${d.cost} · PARTS ${d.mat}</small>`;b.onclick=()=>{sel=k;closeP();say("Build Mode: tap a grid tile")};buildGrid.appendChild(b)});ui()
}
function closeP(){buildPanel.style.display=infoPanel.style.display="none"}function showBuild(){closeP();buildPanel.style.display="block"}function say(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(window.to);window.to=setTimeout(()=>toast.style.opacity=0,1500)}
function local(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);let p=local(e);pointers.set(e.pointerId,p);if(pointers.size===1){tapStart={...p,id:e.pointerId,cx:cam.x,cy:cam.y,moved:false}}else if(pointers.size===2){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;gesture={dist:Math.hypot(dx,dy),z:cam.z,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},cx:cam.x,cy:cam.y};tapStart=null}})
c.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;let p=local(e);pointers.set(e.pointerId,p);
 if(pointers.size===1&&tapStart){let dx=p.x-tapStart.x,dy=p.y-tapStart.y;if(Math.hypot(dx,dy)>6)tapStart.moved=true;if(tapStart.moved){cam.x=tapStart.cx+dx;cam.y=tapStart.cy+dy}}
 else if(pointers.size>=2&&gesture){let a=[...pointers.values()].slice(0,2),dx=a[1].x-a[0].x,dy=a[1].y-a[0].y,dist=Math.max(20,Math.hypot(dx,dy));let nz=Math.max(.62,Math.min(1.65,gesture.z*dist/gesture.dist));let mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};let cc=center();let wx=(gesture.mid.x-cc.x-gesture.cx)/gesture.z,wy=(gesture.mid.y-cc.y-gesture.cy)/gesture.z;cam.z=nz;cam.x=mid.x-cc.x-wx*nz;cam.y=mid.y-cc.y-wy*nz;zv.textContent=Math.round(cam.z*100)+"%"}
})
function pointerEnd(e){let p=local(e),wasTap=tapStart&&tapStart.id===e.pointerId&&!tapStart.moved&&pointers.size===1;pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(wasTap)tapAt(p.x,p.y);tapStart=null}
c.addEventListener("pointerup",pointerEnd);c.addEventListener("pointercancel",pointerEnd);
function tapAt(x,y){let t=inv(x,y);if(sel){let d=defs[sel];if(!footprintFree(t.x,t.y,d)){say("Those tiles are blocked or outside the Haven.");return}if(S.money<d.cost||S.mat<d.mat){say("Not enough resources.");return}S.money-=d.cost;S.mat-=d.mat;S.b.push({type:sel,x:t.x,y:t.y,w:d.w,h:d.h,q:d.q,a:d.a});if(sel==="water"&&S.stage===0){S.stage=1;S.ren+=5}say(d.name+" constructed!");sel=null;ui();return}
 let b=S.b.find(b=>t.x>=b.x&&t.x<b.x+b.w&&t.y>=b.y&&t.y<b.y+b.h);if(b){it.textContent=defs[b.type].name.toUpperCase();ib.innerHTML=`Footprint: <b>${b.w}×${b.h} tiles</b><br>Quality: <b>${b.q}</b><br>Appeal: <b>${b.a}</b><br><br>This facility is snapped to the Haven grid.`;infoPanel.style.display="block"}}
function showSurvivors(){closeP();it.textContent="SURVIVORS";ib.innerHTML=S.sv.map(s=>`<b>${s.name}</b> · ${s.job} Lv.${s.l}<br>HP ${Math.ceil(s.hp)}/${s.max} · ${s.mode.toUpperCase()} · ${s.weapon[0]}`).join("<hr>");infoPanel.style.display="block"}
function showItems(){closeP();it.textContent="ITEMS";ib.innerHTML="Equipment and facility investment items expand after the core town controls are locked.";infoPanel.style.display="block"}
function showGuide(){closeP();it.textContent="V0.5 CONTROLS";ib.innerHTML="<b>One finger:</b> drag to pan.<br><b>Two fingers:</b> pinch to zoom.<br><b>Build:</b> choose a facility, then tap its anchor tile. The complete footprint must fit inside the blue Haven boundary.<br><br>All survivors roam and fight independently.";infoPanel.style.display="block"}
function ui(){money.textContent=S.money;food.textContent=S.food;water.textContent=S.water;mat.textContent=S.mat;ren.textContent=S.ren;clock.textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:00`;qt.textContent=S.stage===0?"Build a Water Collector":S.stage===1?`Defeat 3 Walkers (${Math.min(S.kills,3)}/3)`:"Goal complete — grow the Haven!"}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle="#15332d";g.fillRect(0,0,W,H);
 // full world tiles
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
   let inH=x>=BUILD.x0&&x<=BUILD.x1&&y>=BUILD.y0&&y<=BUILD.y1;
   let outside=y<5||!inH;
   diamond(x,y,outside?((x+y)%2?"#367446":"#3f8050"):((x+y)%2?"#65a64f":"#70b255"),outside?"#285d39":"#568c47")
 }
 // roads
 for(let y=7;y<=16;y+=3)for(let x=BUILD.x0;x<=BUILD.x1;x++)diamond(x,y,"#c6aa70","#a48a59");
 for(let x=4;x<=12;x+=4)for(let y=BUILD.y0;y<=BUILD.y1;y++)diamond(x,y,"#c6aa70","#a48a59");
 // build boundary
 let corners=[[BUILD.x0,BUILD.y0],[BUILD.x1+1,BUILD.y0],[BUILD.x1+1,BUILD.y1+1],[BUILD.x0,BUILD.y1+1]].map(a=>iso(...a));
 g.beginPath();g.moveTo(corners[0].x,corners[0].y);corners.slice(1).forEach(p=>g.lineTo(p.x,p.y));g.closePath();g.strokeStyle="#8bd5e7";g.lineWidth=2;g.stroke();
 // scenery outside / inside
 [[1,3],[14,3],[1,9],[14,9],[2,18],[13,18],[3,4],[12,5],[2,14],[14,15],[7,18]].forEach(a=>tree(...a));
 [[3,8],[11,15],[6,16],[12,9]].forEach(a=>crateAt(...a));
 // Build grid is shown tile-by-tile only in build mode
 if(sel){let d=defs[sel];for(let y=BUILD.y0;y<=BUILD.y1;y++)for(let x=BUILD.x0;x<=BUILD.x1;x++){let ok=footprintFree(x,y,d);diamond(x,y,ok?"#6fd06d":"#b94f4f",ok?"#d5f07a":"#ef8b79")}}
 // preview footprint under current last touch isn't necessary; tapping snaps.
 let things=[];
 S.b.forEach(b=>things.push({y:scr(buildCenter(b)).y,fn:()=>building(b)}));
 S.z.filter(z=>z.hp>0).forEach(z=>things.push({y:scr(z.w).y,fn:()=>zombie(z)}));
 S.sv.forEach(s=>things.push({y:scr(s.w).y,fn:()=>human(s)}));
 things.sort((a,b)=>a.y-b.y).forEach(o=>o.fn());
 for(let f of floats){let p=scr(f.w);g.globalAlpha=Math.min(1,f.a/15);g.fillStyle=f.col;g.font=`bold ${Math.max(9,10*cam.z)}px Arial`;g.textAlign="center";g.fillText(f.t,p.x,p.y-22*cam.z-(55-f.a)*.2);g.globalAlpha=1}
 for(let i=floats.length-1;i>=0;i--)if(--floats[i].a<=0)floats.splice(i,1)
}
function loop(){tick++;S.sv.forEach(ai);S.z.forEach(zai);S.z=S.z.filter(z=>z.hp>0);if(S.z.length<3&&tick%180===0)spawn();if(tick%1000===0){S.hour++;if(S.hour>=24){S.hour=0;S.day++;S.b.forEach(b=>{if(b.type==="farm")S.food+=3;if(b.type==="water")S.water+=4});S.food=Math.max(0,S.food-S.sv.length);S.water=Math.max(0,S.water-S.sv.length)}ui()}draw();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
</script></body></html>
