 S.z.push({type:kind,w:tileCenter(x??a[0],y??a[1]),hp:d.hp,max:d.hp,cool:35+Math.random()*40,phase:Math.random()*100,dest:null,mode:"appear",stateTicks:45+Math.random()*30,target:null,quest});
}
function activeZombieCount(){return S.z.filter(z=>z.hp>0).length}
function monsterGeneration(){
 S.spawnClock++;
 let desired=Math.min(2+S.rank+Math.floor(S.threat/2),7);
 if(activeZombieCount()<desired&&S.spawnClock>150-Math.min(70,S.threat*8)){spawn();S.spawnClock=0}
}
function moveW(o,t,s){let dx=t.x-o.w.x,dy=t.y-o.w.y,d=Math.hypot(dx,dy);o.moving=d>1;if(d<s){o.w.x=t.x;o.w.y=t.y;o.moving=false;return true}o.w.x+=dx/d*s;o.w.y+=dy/d*s;return false}
function nearestZombie(s){let live=S.z.filter(z=>z.hp>0);if(!live.length)return null;live.sort((a,b)=>Math.hypot(s.w.x-a.w.x,s.w.y-a.w.y)-Math.hypot(s.w.x-b.w.x,s.w.y-b.w.y));let top=live.slice(0,Math.min(3,live.length));return top[(s.i+Math.floor(tick/150))%top.length]}
function facilityCapacity(b){return b.type==="canteen"?2:b.type==="house"?1:b.type==="medic"?2:1}
function facilityUsers(b){return S.sv.filter(s=>s.facility===b&&[AI.GO_FACILITY,AI.USE_FACILITY].includes(s.mode)).length}
function needScore(s,b){
 let r=facilityRules[b.type];if(!r||facilityUsers(b)>=facilityCapacity(b))return -999;
 let n=r.need==="injury"?(1-s.hp/s.max)*100:(s[r.need]||0);
 let appeal=(b.a||0)*1.25, quality=(b.q||0)*.5, jitter=((s.i*17+b.x*11+b.y*7)%13);
 if(b.type==="armory"){let next=weapons.find(w=>w[1]>=s.weapon[1]*1.15&&w[2]<=s.money);if(!next)return -999;n=24}
 return n+appeal+quality+jitter-(r.price>s.money?80:0)
}
function chooseFacility(s){
 let options=S.b.map(b=>({b,score:needScore(s,b)})).filter(o=>o.score>35).sort((a,b)=>b.score-a.score);
 return options.length?options[0].b:null
}
function finishFacility(s){
 let b=s.facility,r=facilityRules[b.type];if(!r){s.facility=null;s.mode=AI.FREE;return}
 let pay=Math.min(s.money,r.price);s.money-=pay;moneyGain(pay,s.facility.type);s.sat+=r.sat;floats.push({w:{...s.w},t:"♥+"+r.sat,col:"#ff9fbd",a:70});
 if(r.need==="hunger")s.hunger=Math.max(0,s.hunger-r.benefit);
 if(r.need==="thirst")s.thirst=Math.max(0,s.thirst-r.benefit);
 if(r.need==="fatigue")s.fatigue=Math.max(0,s.fatigue-r.benefit);
 if(r.need==="injury")s.hp=Math.min(s.max,s.hp+r.benefit);
 if(b.type==="armory"){
   let choices=weapons.filter(w=>w[1]>=s.weapon[1]*1.15&&w[2]<=s.money).sort((a,b)=>b[1]-a[1]);
   if(choices.length){let w=choices[0];s.money-=w[2];moneyGain(w[2],"Armory");s.weapon=w;screenToast(s.name+" equipped "+w[0]);s.sat+=2;say(s.name+" bought a "+w[0]+".")}
 }
 s.mastery+=1+(professions[s.job]?.facility||0)*.1;
 if(!s.resident&&s.sat>=35&&!s.requested){s.requested=true;queueResidentRequest(s)}
 s.facility=null;s.activity=null;s.mode=AI.FREE;s.stateTicks=45+s.i*13;s.cool=0;ui()
}
function roamDest(s){let x=BUILD.x0+1+Math.random()*(BUILD.x1-BUILD.x0-2),y=BUILD.y0+1+Math.random()*(BUILD.y1-BUILD.y0-2);return tileCenter(x,y)}
function downedUnassigned(){return S.sv.filter(q=>q.mode===AI.DOWN&&!q.rescuer)}
function rescueScore(r,q){let ja=jobAI[r.job]||jobAI.Civilian;return ja.rescue*25-Math.hypot(r.w.x-q.w.x,r.w.y-q.w.y)}
function assignRescue(){
 let downs=downedUnassigned();if(!downs.length)return false;
 let free=S.sv.filter(r=>r.hp>0&&[AI.FREE,AI.POST_COMBAT].includes(r.mode)&&!r.rescuing);
 if(!free.length)return false;
 let best=null,bestScore=-1e9;
 for(let q of downs)for(let r of free){let sc=rescueScore(r,q);if(sc>bestScore){bestScore=sc;best={r,q}}}
 if(!best)return false;
 best.q.rescuer=best.r;best.r.rescuing=best.q;best.r.target=null;best.r.facility=null;best.r.dest=null;
 best.r.mode=AI.RESCUE_TO;best.r.stateTicks=9999;say(best.r.name+" is rescuing "+best.q.name+".");return true
}
function enterFree(s,delay=35){s.mode=AI.FREE;s.target=null;s.activity=null;s.stateTicks=delay;s.dest=null;s.moving=false}
function enterPostCombat(s){s.mode=AI.POST_COMBAT;s.target=null;s.stateTicks=75+s.i*18;s.moving=false}
function acquireEnemy(s){
 let z=nearestZombie(s);if(!z)return false;
 let d=Math.hypot(s.w.x-z.w.x,s.w.y-z.w.y),cfg=jobAI[s.job]||jobAI.Civilian;
 if(d<=cfg.aggro){s.target=z;s.mode=AI.CHASE;s.stateTicks=9999;s.dest=null;return true}
 return false
}
function chooseTownAction(s){
 let b=chooseFacility(s);
 if(b&&b!==s.lastFacility){s.facility=b;s.mode=AI.GO_FACILITY;s.stateTicks=9999;s.dest=null;return true}
 return false
}
function ai(s){
 if(s.cool>0)s.cool--; if(s.stateTicks>0)s.stateTicks--;
 if(tick%90===s.i*17%90&&![AI.DOWN,AI.HOSPITAL].includes(s.mode)){s.hunger=Math.min(100,s.hunger+1.5);s.thirst=Math.min(100,s.thirst+1.8);s.fatigue=Math.min(100,s.fatigue+1)}
 if(s.hp<=0&&s.mode!==AI.DOWN){s.hp=0;s.mode=AI.DOWN;s.target=null;s.dest=null;s.facility=null;s.activity=null;s.moving=false;s.rescuer=null;s.rescuing=null;s.carrying=null;say(s.name+" collapsed!");return}
 if(s.mode===AI.DOWN){s.moving=false;return}
 if(s.mode===AI.HOSPITAL){s.moving=false;if(s.stateTicks<=0){s.hp=Math.round(s.max*.70);s.fatigue=Math.max(0,s.fatigue-35);enterFree(s,60);say(s.name+" recovered and returned.")}return}

 // A rescuer commits to the rescue until delivery.
 if(s.mode===AI.RESCUE_TO){
   let q=s.rescuing;if(!q||q.mode!==AI.DOWN){s.rescuing=null;enterPostCombat(s);return}
   if(moveW(s,q.w,.38)){s.carrying=q;q.w={...s.w};s.mode=AI.RESCUE_CARRY;say(s.name+" picked up "+q.name+".")}return
 }
 if(s.mode===AI.RESCUE_CARRY){
   let q=s.carrying;if(!q){enterPostCombat(s);return}
   let h=hospital();if(moveW(s,h,.30)){q.w={...h};q.mode=AI.HOSPITAL;q.hp=1;q.stateTicks=230;q.rescuer=null;s.carrying=null;s.rescuing=null;enterPostCombat(s);say(q.name+" reached the Medic Tent.")}else q.w={x:s.w.x-5,y:s.w.y-2};return
 }

 // Facility states are committed; no enemy retargeting while using a facility.
 if(s.mode===AI.GO_FACILITY){
   if(!s.facility||facilityUsers(s.facility)>facilityCapacity(s.facility)){s.facility=null;enterFree(s,25);return}
   if(routeMove(s,buildCenter(s.facility),.32)){let r=facilityRules[s.facility.type];s.mode=AI.USE_FACILITY;s.activity=r.label;s.stateTicks=r.use;say(s.name+": "+r.label+"…")}return
 }
 if(s.mode===AI.USE_FACILITY){s.moving=false;if(s.stateTicks<=0){s.lastFacility=s.facility;finishFacility(s);s.stateTicks=50+s.i*9}return}

 // Combat states are committed to one target.
 if([AI.CHASE,AI.ATTACK,AI.RECOVER].includes(s.mode)){
   if(!s.target||s.target.hp<=0){enterPostCombat(s);return}
   if(s.mode===AI.CHASE){let d=Math.hypot(s.w.x-s.target.w.x,s.w.y-s.target.w.y);if(d>20)moveW(s,s.target.w,.48);else{s.moving=false;s.mode=AI.ATTACK;s.stateTicks=32+s.i*8}return}
   if(s.mode===AI.ATTACK){s.moving=false;if(s.stateTicks<=0){let z=s.target,bonus=professions[s.job]?.combat||0,dmg=Math.round(6+s.weapon[1]*.55+bonus);z.hp-=dmg;floats.push({w:{...z.w},t:"-"+dmg,col:"#ffe06b",a:55});s.mastery+=.5;
     if(z.hp<=0){S.kills++;let zd=zombieTypes[z.type]||zombieTypes.walker;s.money+=zd.reward+bonus;S.money+=4;S.earned+=4;renownGain(zd.ren,zd.name+" defeated");say(s.name+" defeated a Walker!");if(S.stage===1&&S.kills>=3){S.stage=2;renownGain(10,"Goal complete");say("Goal complete!")}enterPostCombat(s);return}
     s.mode=AI.RECOVER;s.stateTicks=48+s.i*9}return}
   if(s.mode===AI.RECOVER){s.moving=false;if(s.stateTicks<=0)s.mode=AI.CHASE;return}
 }

 // Post-combat deliberately pauses, then checks rescue BEFORE a new target.
 if(s.mode===AI.POST_COMBAT){
   s.moving=false;
   if(downedUnassigned().length){assignRescue();if(s.mode===AI.RESCUE_TO)return}
   if(s.stateTicks<=0)enterFree(s,20);return
 }

 // FREE is the only decision state. Decisions are not reconsidered every frame.
 if(s.mode===AI.FREE){
   if(s.stateTicks>0){if(!s.dest)s.dest=roamDest(s);if(s.dest&&routeMove(s,s.dest,.28))s.dest=null;return}
   if(downedUnassigned().length){assignRescue();if(s.mode===AI.RESCUE_TO)return}
   let cfg=jobAI[s.job]||jobAI.Civilian;
   if(Math.random()<Math.min(.9,.45*cfg.town)&&chooseTownAction(s))return;
   if(acquireEnemy(s))return;
   if(chooseTownAction(s))return;
   s.lastFacility=null;s.dest=roamDest(s);s.stateTicks=55+Math.random()*80;routeMove(s,s.dest,.28);return
 }
}
function zai(z){
 let d=zombieTypes[z.type]||zombieTypes.walker;if(z.cool>0)z.cool--;if(z.stateTicks>0)z.stateTicks--;
 if(z.mode==="appear"){z.moving=false;if(z.stateTicks<=0){z.mode="idle";z.stateTicks=35+Math.random()*70}return}
 if(z.mode==="idle"){
   if(!z.dest||z.stateTicks<=0){z.dest={x:z.w.x+(Math.random()-.5)*34,y:z.w.y+(Math.random()-.5)*18};z.stateTicks=35+Math.random()*80}
   if(z.dest)moveW(z,z.dest,d.spd);
   let candidates=S.sv.filter(s=>s.hp>0&&![AI.DOWN,AI.HOSPITAL].includes(s.mode)).sort((a,b)=>Math.hypot(a.w.x-z.w.x,a.w.y-z.w.y)-Math.hypot(b.w.x-z.w.x,b.w.y-z.w.y));
   if(candidates.length&&Math.hypot(candidates[0].w.x-z.w.x,candidates[0].w.y-z.w.y)<d.aggro){z.target=candidates[0];z.mode="zchase"}
   return
 }
 if(z.mode==="zchase"){
   if(!z.target||z.target.hp<=0||[AI.DOWN,AI.HOSPITAL].includes(z.target.mode)){z.target=null;z.mode="idle";z.stateTicks=40;return}
   let dist=Math.hypot(z.target.w.x-z.w.x,z.target.w.y-z.w.y);
   if(dist>115&&!z.quest){z.target=null;z.mode="idle";z.stateTicks=60;return}
   if(dist>19)moveW(z,z.target.w,d.spd*2.2);else{z.mode="zattack";z.stateTicks=26}
   return
 }
 if(z.mode==="zattack"){z.moving=false;if(z.stateTicks<=0){if(z.target&&z.target.hp>0){z.target.hp-=d.atk;floats.push({w:{...z.target.w},t:"-"+d.atk,col:"#ff6e62",a:55})}z.mode="zrecover";z.stateTicks=58+Math.random()*22}return}
 if(z.mode==="zrecover"){if(z.stateTicks<=0)z.mode=z.target&&z.target.hp>0?"zchase":"idle";return}
}

function local(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);let p=local(e);pointers.set(e.pointerId,p);if(pointers.size===1){tapStart={...p,id:e.pointerId,cx:cam.x,cy:cam.y,moved:false}}else if(pointers.size===2){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;gesture={dist:Math.hypot(dx,dy),z:cam.z,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},cx:cam.x,cy:cam.y};tapStart=null}})
c.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;let p=local(e);pointers.set(e.pointerId,p);
 if(pointers.size===1&&tapStart){let dx=p.x-tapStart.x,dy=p.y-tapStart.y;if(Math.hypot(dx,dy)>6)tapStart.moved=true;if(tapStart.moved){cam.x=tapStart.cx+dx;cam.y=tapStart.cy+dy}}
 else if(pointers.size>=2&&gesture){let a=[...pointers.values()].slice(0,2),dx=a[1].x-a[0].x,dy=a[1].y-a[0].y,dist=Math.max(20,Math.hypot(dx,dy));let nz=Math.max(.62,Math.min(1.65,gesture.z*dist/gesture.dist));let mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};let cc=center();let wx=(gesture.mid.x-cc.x-gesture.cx)/gesture.z,wy=(gesture.mid.y-cc.y-gesture.cy)/gesture.z;cam.z=nz;cam.x=mid.x-cc.x-wx*nz;cam.y=mid.y-cc.y-wy*nz;zv.textContent=Math.round(cam.z*100)+"%"}
})
function pointerEnd(e){let p=local(e),wasTap=tapStart&&tapStart.id===e.pointerId&&!tapStart.moved&&pointers.size===1;pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(wasTap)tapAt(p.x,p.y);tapStart=null}

// Grid-route layer. Characters still render in world pixels, but destinations are routed
// through walkable tile centers so buildings/occupied tiles can become real obstacles.
function worldToTile(w){
 let a=w.x/(TW/2),b=w.y/(TH/2);return{x:Math.round((a+b)/2-.5),y:Math.round((b-a)/2-.5)}
}
function occupiedTile(x,y){
 return S.b.some(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)
}
function walkable(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&!occupiedTile(x,y)}
function findRoute(from,to){
 let a=worldToTile(from),b=worldToTile(to);if(!walkable(b.x,b.y))return [to];
 let key=(x,y)=>x+","+y,q=[[a.x,a.y]],prev=new Map([[key(a.x,a.y),null]]),dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 while(q.length){
  let [x,y]=q.shift();if(x===b.x&&y===b.y)break;
  for(let [dx,dy] of dirs){let nx=x+dx,ny=y+dy,k=key(nx,ny);if(walkable(nx,ny)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny])}}
 }
 let bk=key(b.x,b.y);if(!prev.has(bk))return [to];let cells=[],cur=[b.x,b.y];
 while(cur){cells.push(tileCenter(cur[0],cur[1]));cur=prev.get(key(cur[0],cur[1]))}
 cells.reverse();cells.push(to);return cells.slice(1)
}
function routeMove(s,dest,spd){
 if(!s.route||s.routeGoal!==dest){s.route=findRoute(s.w,dest);s.routeGoal=dest}
 if(!s.route.length){s.route=null;s.routeGoal=null;return true}
 let p=s.route[0];if(moveW(s,p,spd)){s.route.shift();if(!s.route.length){s.route=null;s.routeGoal=null;return true}}return false
}
function residents(){return S.sv.filter(s=>s.resident).length}
function checkRank(){
 let next=rankRules[S.rank];if(!next)return;
 if(S.ren>=next.ren&&S.earned>=next.income&&residents()>=next.residents&&S.b.length>=next.facilities){
   S.rank++;S.threat++;S.money+=250*S.rank;S.mat+=3;renownGain(5,"Haven Rank "+S.rank);screenToast("★ HAVEN RANK "+S.rank+" ★");say("HAVEN RANK "+S.rank+"! New threats and opportunities.");ui()
 }
}
function rankText(){return "★".repeat(S.rank)}
function triggerWorldEvent(){
 S.eventClock++;if(S.eventClock<1500)return;S.eventClock=0;
 let r=Math.random();
 if(r<.35){S.threat=Math.min(8,S.threat+1);say("Zombie activity is rising outside the Haven.")}
 else if(r<.65){S.money+=80;S.earned+=80;say("A survivor caravan traded with the Haven. +$80")}
 else {S.mat+=2;say("Scavengers recovered spare parts. +2 PARTS")}
}
function ui(){money.textContent=S.money;food.textContent=S.food;water.textContent=S.water;mat.textContent=S.mat;ren.textContent=S.ren;rank.textContent=rankText();threat.textContent=S.threat;clock.textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:00`;qt.textContent=S.stage===0?"Build a Water Collector":S.stage===1?`Defeat 3 Walkers (${Math.min(S.kills,3)}/3)`:"Goal complete — grow the Haven!"}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle="#15332d";g.fillRect(0,0,W,H);
 // full world tiles
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
   let inH=x>=BUILD.x0&&x<=BUILD.x1&&y>=BUILD.y0&&y<=BUILD.y1;
   let outside=y<5||!inH;
   if(!drawTileAsset(outside?"grass":"grass_detail",x,y))diamond(x,y,outside?"#3f8050":"#70b255",outside?"#285d39":"#568c47")
 }
 // roads
 for(let y=7;y<=16;y+=3)for(let x=BUILD.x0;x<=BUILD.x1;x++){if(!drawTileAsset("road",x,y))diamond(x,y,"#77756a","#55564f")};
 for(let x=4;x<=12;x+=4)for(let y=BUILD.y0;y<=BUILD.y1;y++){if(!drawTileAsset("road",x,y))diamond(x,y,"#77756a","#55564f")};
 // build boundary
 let corners=[[BUILD.x0,BUILD.y0],[BUILD.x1+1,BUILD.y0],[BUILD.x1+1,BUILD.y1+1],[BUILD.x0,BUILD.y1+1]].map(a=>iso(...a));
 g.beginPath();g.moveTo(corners[0].x,corners[0].y);corners.slice(1).forEach(p=>g.lineTo(p.x,p.y));g.closePath();g.strokeStyle="#8bd5e7";g.lineWidth=2;g.stroke();
 // scenery outside / inside
 [[1,3],[14,3],[1,9],[14,9],[2,18],[13,18],[3,4],[12,5],[2,14],[14,15],[7,18]].forEach(a=>tree(...a));
 [[3,8],[11,15],[6,16],[12,9]].forEach(a=>crateAt(...a));
 // Build grid is shown tile-by-tile only in build mode
 if(sel){
   for(let y=BUILD.y0;y<=BUILD.y1;y++)for(let x=BUILD.x0;x<=BUILD.x1;x++){
     let occ=tileOccupied(x,y);diamond(x,y,occ?"#b75a55":"#5fae61",occ?"#e58a83":"#9bdc85")
   }
   if(preview){
     let d=defs[sel],ok=footprintFree(preview.x,preview.y,d);preview.ok=ok;
     // Exact tiles the facility will occupy.
     for(let yy=0;yy<d.h;yy++)for(let xx=0;xx<d.w;xx++)diamond(preview.x+xx,preview.y+yy,ok?"#72d9df":"#e25b55",ok?"#d7ffff":"#ffb0a8");
   }
 }
 let things=[];
 if(preview&&sel)things.push({y:scr(buildCenter(preview)).y+.01,fn:()=>building(preview,true,preview.ok)});
 S.b.forEach(b=>things.push({y:scr(buildCenter(b)).y,fn:()=>building(b)}));
 S.z.filter(z=>z.hp>0).forEach(z=>things.push({y:scr(z.w).y,fn:()=>zombie(z)}));
 S.sv.forEach(s=>things.push({y:scr(s.w).y,fn:()=>human(s)}));
 things.sort((a,b)=>a.y-b.y).forEach(o=>o.fn());
 for(let f of floats){let p=scr(f.w);g.globalAlpha=Math.min(1,f.a/15);g.fillStyle=f.col;g.font=`bold ${Math.max(9,10*cam.z)}px Arial`;g.textAlign="center";g.fillText(f.t,p.x,p.y-22*cam.z-(55-f.a)*.2);g.globalAlpha=1}
 for(let i=floats.length-1;i>=0;i--)if(--floats[i].a<=0)floats.splice(i,1)
}
function loop(){tick++;S.sv.forEach(ai);S.z.forEach(zai);S.z=S.z.filter(z=>z.hp>0);monsterGeneration();triggerWorldEvent();visitorArrival();if(tick%240===0)checkRank();if(tick%1000===0){S.hour++;if(S.hour>=24){S.hour=0;S.day++;S.b.forEach(b=>{if(b.type==="farm")S.food+=3;if(b.type==="water")S.water+=4});S.food=Math.max(0,S.food-S.sv.length);S.water=Math.max(0,S.water-S.sv.length)}ui()}draw();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
</script></body></html>
