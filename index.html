<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#2b2219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/Jersey15-Regular.ttf" as="font" type="font/ttf" crossorigin>
<title>Zombie Haven V2.28.0</title>
<style>
@font-face{font-family:'Jersey 15';src:url('assets/fonts/Jersey15-Regular.ttf') format('truetype');font-display:block}
:root{--wood:#7a5a36;--woodL:#b48a52;--woodD:#3b2a19;--panel:#2b2520;--panel2:#3a322a;--ink:#fbf0d6;--muted:#d6c39b;--gold:#ffcf5a;--good:#8fd46a;--bad:#ff7a5c;--blue:#7cc8ff;
 --f:'Jersey 15',-apple-system,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14100c;font-family:var(--f);overscroll-behavior:none;color:var(--ink);font-size:19px;letter-spacing:.3px}
button,input{font-family:var(--f);letter-spacing:.3px}
#app{height:100dvh;max-width:560px;margin:auto;position:relative;background:#1a2a20;padding-top:env(safe-area-inset-top);overflow:hidden;display:flex;flex-direction:column}
#world{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#10241f}
canvas{width:100%;height:100%;display:block;touch-action:none}
.out{text-shadow:-1px -1px 0 #120c06,1px -1px 0 #120c06,-1px 1px 0 #120c06,1px 1px 0 #120c06,0 2px 0 #120c06}
/* wood frame used by plaque, buttons and panels */
.frame{background:linear-gradient(#433629,#2e251d);border:3px solid var(--woodD);box-shadow:inset 0 0 0 2px var(--woodL),inset 0 0 0 4px var(--woodD),2px 3px 0 #0008;border-radius:7px}
#plaque{position:absolute;z-index:8;top:6px;left:6px;padding:6px 11px 7px;max-width:74%;cursor:pointer}
#plaque .res{display:flex;gap:12px;font-size:26px;line-height:26px;align-items:center;white-space:nowrap}
#plaque .res span{display:flex;align-items:center;gap:3px}#plaque .res i{font-style:normal;font-size:19px}
#plaque .res b{font-weight:400;color:#fff6dc}
#plaque .trip{color:var(--blue)}
#quest{margin-top:3px;font-size:18px;line-height:19px;color:var(--muted);cursor:pointer}#quest b{display:block;font-weight:400;color:#e6d3a8}#quest span{display:block;color:#fff1c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lmenu{position:absolute;z-index:8;left:5px;top:112px;display:flex;flex-direction:column;gap:8px}
.lm{width:76px;height:68px;padding:0;color:var(--ink);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.lm i{font-style:normal;font-size:27px;line-height:32px}.lm:active,.bb:active{transform:translateY(2px);filter:brightness(1.25)}
#gauge{position:absolute;z-index:8;right:0;bottom:0;width:160px;height:104px;pointer-events:none;overflow:hidden}
#gauge .wheel{position:absolute;right:-74px;bottom:-78px;width:206px;height:206px;border-radius:50%;background:repeating-conic-gradient(#6a4f33 0 6deg,#54402a 6deg 30deg);border:6px solid var(--woodD);box-shadow:inset 0 0 0 3px var(--woodL),inset 0 0 0 26px #3a2e22}
#gauge .glabel{position:absolute;right:58px;bottom:66px;font-size:25px;color:#ffb44a}
#gauge .gval{position:absolute;right:8px;bottom:40px;font-size:27px;line-height:26px;background:#1c1712;border:2px solid var(--woodL);border-radius:5px;padding:0 7px}
#gauge .grank{position:absolute;right:8px;bottom:20px;font-size:17px;color:var(--muted)}
#gauge .gbar{position:absolute;right:8px;bottom:7px;width:130px;height:10px;background:#1a140e;border:2px solid var(--woodL);border-radius:3px;overflow:hidden}#gauge .gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf5a,#ff7a3a)}
#bottom{flex:0 0 auto;position:relative;z-index:9;display:flex;align-items:center;gap:7px;height:calc(60px + env(safe-area-inset-bottom));padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:repeating-linear-gradient(0deg,#4a4038 0 12px,#3a322c 12px 14px);border-top:3px solid var(--woodD);box-shadow:inset 0 2px 0 var(--woodL)}
.bb{flex:0 0 auto;height:44px;min-width:50px;padding:0 10px;color:var(--ink);font-size:22px;line-height:20px}
#btnSave{min-width:96px;margin-right:auto}.bb.on{background:linear-gradient(#55803f,#3a5a2b)}
/* panels */
.panel{display:none;position:absolute;z-index:11;left:6px;right:6px;bottom:6px;max-height:80%;flex-direction:column;padding:0;overflow:visible}
.panel.show{display:flex}
.ph{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:46px;margin:-3px -3px 0}
.ph h3{margin:0;font-weight:400;font-size:27px;color:var(--gold);padding:2px 26px 0;background:linear-gradient(#6c5136,#4a3724);border:3px solid var(--woodD);box-shadow:inset 0 0 0 2px var(--woodL);border-radius:8px;transform:translateY(-14px);white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.ph .x,.ph .back{position:absolute;top:4px;width:40px;height:36px;border-radius:7px;font-size:24px;line-height:20px;color:#fff;padding:0;border:3px solid var(--woodD);box-shadow:inset 0 0 0 2px #e79a84}
.ph .x{right:6px;background:#a33b2c}.ph .back{left:6px;background:#5a4a38;box-shadow:inset 0 0 0 2px var(--woodL);display:none}
.pb{flex:1 1 auto;overflow:auto;padding:0 10px 12px;font-size:19px;line-height:1.25;-webkit-user-select:text;user-select:text}
.pb small,.pb .sm{font-size:16px;color:var(--muted)}
.pb b{font-weight:400;color:var(--gold)}
.tabs{display:flex;gap:5px;margin:0 0 8px;position:sticky;top:0;z-index:2;background:#2f271f;padding:3px 0 5px}
.tabs button{flex:1;background:#3d342b;color:var(--muted);border:2px solid #5d4a35;border-radius:7px;font-size:19px;padding:5px 2px;min-height:38px}
.tabs button.on{background:#5c7a3d;color:#fff;border-color:#b9de8a}
.act{background:linear-gradient(#5c4a36,#47392a);border:2px solid var(--woodD);box-shadow:inset 0 0 0 2px #8d7050;color:var(--ink);border-radius:7px;padding:8px 13px;margin:6px 6px 0 0;font-size:19px}
.act.go{background:linear-gradient(#5f8a3f,#466b2c);box-shadow:inset 0 0 0 2px #a8d77a}.act.danger{background:linear-gradient(#9a3f30,#7a2e22);box-shadow:inset 0 0 0 2px #d98a74}
.act[disabled],.act.off{opacity:.45}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.card{background:#3a3129;border:2px solid #574634;border-radius:8px;padding:7px 8px;margin:0 0 7px}
.lst .card{display:flex;align-items:center;gap:9px;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}.kv div{display:flex;justify-content:space-between}
.bar{height:9px;background:#1c1712;border:1px solid #574634;border-radius:4px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--good)}.bar.hp i{background:#e2564a}.bar.xp i{background:#68b8ff}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
/* build menu */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bcard{background:#3a3129;border:2px solid #574634;border-radius:8px;padding:5px 3px 4px;color:var(--ink);display:flex;flex-direction:column;align-items:center;font-size:17px;line-height:17px;min-height:122px}
.bcard .im{height:78px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bcard img{max-width:100%;max-height:78px}
.bcard .nm{margin-top:3px;text-align:center}.bcard .co{color:var(--gold);font-size:17px}
.bcard.lock{opacity:.5}.bcard.lock .co{color:var(--muted)}
.bdetail{text-align:center}.bdetail .big{height:150px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(#4a5a3a,#2e3324 70%);border:2px solid #574634;border-radius:8px;margin-bottom:8px}
.bdetail .big img{max-height:140px}.bdetail .desc{text-align:left}
.icon{width:44px;height:44px;flex:0 0 auto;background:#e9b9d8;border:2px solid #7a4b6a;border-radius:6px;display:flex;align-items:center;justify-content:center}
.icon img{width:36px;height:36px}
.portrait{width:52px;height:56px;flex:0 0 auto;background:radial-gradient(#556b47,#2e3a27);border:2px solid #574634;border-radius:7px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.portrait img{width:48px;height:auto}
/* placement bar */
#confirmBar{display:none;position:absolute;z-index:14;left:50%;transform:translateX(-50%);bottom:6px;width:min(96%,480px);padding:7px}
#confirmName{font-size:19px;margin-bottom:6px;text-align:center;line-height:20px}
#confirmRow{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch}
#confirmRow>button{padding:8px;font-size:21px;margin:0}
#nudge{display:grid;grid-template-columns:repeat(2,40px);grid-template-rows:repeat(2,30px);gap:3px}
#nudge button{background:#5c4a36;border:2px solid var(--woodD);color:#fff;border-radius:5px;font-size:18px;padding:0}
/* toasts, speech, popups */
.fxLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:12}
.toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);font-size:22px;color:#fff7c7;background:#2b2520e8;border:2px solid var(--woodL);border-radius:8px;padding:5px 12px;animation:toastUp 1.6s forwards;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
@keyframes toastUp{0%{opacity:0;transform:translate(-50%,5px) scale(.8)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.06)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.renFlash{animation:renPulse .55s}@keyframes renPulse{50%{transform:scale(1.22);filter:brightness(1.6)}}
#say{position:absolute;z-index:13;left:50%;bottom:10px;transform:translateX(-50%);background:#2b2520ee;color:var(--ink);border:2px solid var(--woodL);border-radius:8px;padding:6px 11px;font-size:19px;line-height:20px;text-align:center;max-width:70%;opacity:0;pointer-events:none;transition:opacity .2s}
.evBox{max-height:70%;overflow:auto;position:absolute;left:6%;right:6%;top:22%;padding:14px 14px 16px;z-index:40;text-align:center;box-shadow:0 0 0 9999px #0009}
.evTitle{font-size:28px;color:var(--gold);margin-bottom:8px;line-height:28px}.evText{margin-bottom:9px;line-height:23px;font-size:20px}.evGain{color:var(--good);font-size:20px;margin-bottom:10px}
.evBox button{padding:8px 24px;margin:4px;font-size:22px}
#eventModal{position:absolute;inset:0;pointer-events:none;z-index:40}#eventModal .evBox{pointer-events:auto}
.request{position:absolute;left:5%;right:5%;bottom:84px;padding:11px;z-index:15;font-size:19px;text-align:center}
.request b{font-weight:400;color:var(--gold);font-size:23px}
#crash{display:none;position:absolute;z-index:99;left:6px;right:6px;top:90px;background:#651f1f;color:#fff;border:2px solid #ff9b8e;padding:8px;font:12px monospace}
#loading{position:absolute;inset:0;z-index:50;background:#14100c;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px}
#zoom{display:none}
</style></head><body>
<div id="app">
 <div id="world"><canvas id="game"></canvas>
  <div id="plaque" class="frame out"><div class="res"><span><i>🍖</i><b id="food">0</b></span><span><i>💧</i><b id="water">0</b></span><span><i>⚙️</i><b id="mat">0</b></span><span class="trip" id="tripChip" style="display:none"><i>🧭</i><b id="tripTime">0:00</b></span></div>
   <div id="quest"><b id="clock">DAY 1 · 08:00</b><span id="qt"></span></div></div>
  <div id="lmenu"><button class="lm frame out" id="mBuild"><i>🔨</i>Build</button><button class="lm frame out" id="mExp"><i>🧭</i>Explore</button><button class="lm frame out" id="mSurv"><i>👥</i>People</button><button class="lm frame out" id="mTown"><i>🏚️</i>Town</button><button class="lm frame out" id="mGuide"><i>📖</i>Guide</button></div>
  <div id="gauge" class="out"><div class="wheel"></div><div class="glabel">Renown</div><div class="gval"><span id="ren">0</span></div><div class="grank">Rank <span id="rank">★</span> · ☠<span id="threat">1</span></div><div class="gbar"><i id="renBar"></i></div></div>
  <div id="zoom"><span id="zv">100%</span></div>
  <div id="fx" class="fxLayer out"></div><div id="say" class="out"></div>
  <div id="requestBox"></div><div id="eventModal"></div>
  <div class="panel frame" id="infoPanel"><div class="ph"><button class="back out" id="pBack">‹</button><h3 id="it" class="out">INFO</h3><button class="x out" id="closeInfo">✕</button></div><div class="pb" id="ib"></div></div>
  <div id="confirmBar" class="frame"><div id="confirmName" class="out">PLACE?</div><div id="confirmRow"><button id="noBuild" class="act danger out">Cancel</button><div id="nudge"><button data-d="-1,0" title="up-left">↖</button><button data-d="0,-1" title="up-right">↗</button><button data-d="0,1" title="down-left">↙</button><button data-d="1,0" title="down-right">↘</button></div><button id="yesBuild" class="act go out">Build</button></div></div>
  <div id="crash"></div>
 </div>
 <div id="bottom"><button class="bb frame out" id="btnSave">Save</button><button class="bb frame out" id="btnSpeed" title="Speed">1×</button><button class="bb frame out" id="btnSound" title="Sound">🔊</button><button class="bb frame out" id="btnLog" title="Event log">📜</button><button class="bb frame out" id="btnCenter" title="Recenter">⌖</button><button class="bb frame out" id="btnDebug" title="Geometry overlay" style="display:none">🐞</button></div>
 <div id="loading">LOADING ZOMBIE HAVEN…</div>
</div>
<script src="js/iso.js?v=2.28.0"></script>
<script src="js/world.js?v=2.28.0"></script>
<script src="js/chars.js?v=2.28.0"></script>
<script src="js/procart.js?v=2.28.0"></script>
<script src="js/sound.js?v=2.28.0"></script>
<script src="js/game.js?v=2.28.0"></script>
</body></html>
