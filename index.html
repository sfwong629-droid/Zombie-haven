<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Zombie Haven V0.4</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#171b16;font-family:Arial,"Helvetica Neue",sans-serif}#app{height:100dvh;max-width:520px;margin:auto;position:relative;background:#263225;padding-top:env(safe-area-inset-top)}#hud{height:73px;background:linear-gradient(#efe2b7,#c8b681);border-bottom:4px solid #665a3e;color:#26231b;padding:6px 8px;z-index:5;position:relative;font-weight:900}.top{display:flex;justify-content:space-between;font-size:11px}.res{display:flex;gap:5px;margin-top:7px}.chip{border:2px solid #776947;background:#f5e9c2;padding:3px 5px;border-radius:4px;font-size:10px}#wrap{position:absolute;top:73px;bottom:100px;left:0;right:0;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#quest{position:absolute;z-index:6;top:82px;left:7px;background:#eee0b4;border:3px solid #655a3f;color:#27231b;padding:5px 7px;font-size:10px;box-shadow:3px 3px #0005}.toast{position:absolute;z-index:10;top:145px;left:50%;transform:translateX(-50%);background:#20261ddd;color:#fff0c5;border:2px solid #d9c99a;padding:7px 10px;font-size:10px;text-align:center;max-width:82%;opacity:0}.panel{display:none;position:absolute;z-index:9;left:7px;right:7px;bottom:105px;background:#e9d9aa;color:#27231b;border:3px solid #64593e;box-shadow:4px 4px #0007;padding:8px}.panel h3{font-size:13px;margin:0 0 6px}.x{float:right;background:#91463d;color:#fff;border:1px solid #4e241e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.build{background:#c8b57e;border:2px solid #685b3e;color:#27231b;padding:7px;text-align:left;font-weight:900;font-size:10px}.build small{display:block;margin-top:2px}#bottom{position:absolute;z-index:7;bottom:0;left:0;right:0;height:100px;background:#d4c18b;border-top:4px solid #64593e;padding:5px 5px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.menu{background:linear-gradient(#f4e7bd,#c5b27d);border:2px solid #64583d;border-radius:4px;color:#28241c;font-weight:900;font-size:9px}.ico{display:block;font-size:18px}</style></head>
<body><div id="app"><div id="hud"><div class="top"><span id="clock">DAY 1 · 08:00</span><span>HAVEN ★1 · RENOWN <span id="ren">0</span></span></div><div class="res"><span class="chip">$ <span id="money">1800</span></span><span class="chip">FOOD <span id="food">12</span></span><span class="chip">WATER <span id="water">12</span></span><span class="chip">PARTS <span id="mat">24</span></span></div></div><div id="quest"><b>FIRST GOAL</b><br><span id="qt">Build a Water Collector (0/1)</span></div><div id="wrap"><canvas id="game"></canvas></div><div class="toast" id="toast"></div>
<div class="panel" id="buildPanel"><button class="x" onclick="closeP()">X</button><h3>BUILD FACILITY</h3><div class="grid" id="buildGrid"></div></div><div class="panel" id="infoPanel"><button class="x" onclick="closeP()">X</button><h3 id="it">INFO</h3><div id="ib" style="font-size:10px;line-height:1.55"></div></div>
<div id="bottom"><button class="menu" onclick="showBuild()"><span class="ico">▣</span>BUILD</button><button class="menu" onclick="showSurvivors()"><span class="ico">♟♟</span>SURVIVORS</button><button class="menu" onclick="showItems()"><span class="ico">◆</span>ITEMS</button><button class="menu" onclick="showGuide()"><span class="ico">?</span>GUIDE</button></div></div>
<script>
const c=document.getElementById("game"),g=c.getContext("2d");g.imageSmoothingEnabled=false;let W,H,DPR,TW=50,TH=25,OX,OY,tick=0,sel=null;
const COLS=13,ROWS=16,cam={x:0,y:0};let drag={on:false,x:0,y:0,cx:0,cy:0,moved:false};
const defs={farm:{name:"Farm",cost:300,mat:4,q:10,a:5},water:{name:"Water Collector",cost:250,mat:3,q:10,a:4},canteen:{name:"Canteen",cost:450,mat:5,q:10,a:10},armory:{name:"Armory",cost:800,mat:8,q:10,a:12}};
const weapons=[["Pipe",6,0],["Knife",9,45],["Bat",14,75],["Machete",19,120],["Pistol",24,180]];
const S={money:1800,food:12,water:12,mat:24,ren:0,day:1,hour:8,kills:0,stage:0,b:[],sv:[],z:[]},floats=[];
function resize(){let r=wrap.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";g.setTransform(DPR,0,0,DPR,0,0);TW=Math.min(52,Math.max(44,W/8.5));TH=TW*.5;OX=W/2;OY=42}addEventListener("resize",resize);resize();
function iso(x,y){return{x:OX+(x-y)*TW/2+cam.x,y:OY+(x+y)*TH/2+cam.y}}function pos(x,y){let p=iso(x+.5,y+.5);return{x:p.x,y:p.y+TH*.45}}function worldPos(x,y){let sx=OX+(x-y)*TW/2,sy=OY+(x+y)*TH/2+TH*.45;return{x:sx,y:sy}}function screen(w){return{x:w.x+cam.x,y:w.y+cam.y}}
function inv(px,py){px-=cam.x;py-=cam.y;let a=(px-OX)/(TW/2),b=(py-OY)/(TH/2);return{x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,fill,edge="#30362d"){let p=iso(x,y);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+TW/2,p.y+TH/2);g.lineTo(p.x,p.y+TH);g.lineTo(p.x-TW/2,p.y+TH/2);g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=edge;g.lineWidth=1;g.stroke()}
function rect(x,y,w,h,col,edge="#292820"){g.fillStyle=edge;g.fillRect(Math.round(x-1),Math.round(y-1),w+2,h+2);g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function valid(x,y){return x>=1&&y>=6&&x<COLS-1&&y<ROWS-1&&!S.b.some(b=>b.x==x&&b.y==y)}
function gateW(){return worldPos(6,5.5)}
function tree(x,y){rect(x-2,y-4,4,13,"#54462f");rect(x-9,y-16,18,8,"#405b32");rect(x-6,y-22,13,8,"#58723e");rect(x-12,y-10,9,7,"#344d2d")}
function rubble(x,y){rect(x-8,y-3,6,4,"#827a68");rect(x,y-5,7,5,"#5f5e55");rect(x+6,y-2,5,3,"#9a8c70")}
function barrel(x,y){rect(x-4,y-9,8,10,"#6d4932");g.fillStyle="#302b25";g.fillRect(x-4,y-6,8,2)}
function crate(x,y){rect(x-6,y-7,12,8,"#85663c");g.strokeStyle="#4a3825";g.beginPath();g.moveTo(x-5,y-6);g.lineTo(x+5,y);g.moveTo(x+5,y-6);g.lineTo(x-5,y);g.stroke()}
function isoBox(cx,base,w,h,roof,front,side){
 g.fillStyle="#1c211c";g.beginPath();g.ellipse(cx,base+4,w*.65,6,0,0,7);g.fill();
 g.fillStyle=front;g.beginPath();g.moveTo(cx-w/2,base-h);g.lineTo(cx,base-h+w*.22);g.lineTo(cx,base);g.lineTo(cx-w/2,base-w*.22);g.closePath();g.fill();
 g.fillStyle=side;g.beginPath();g.moveTo(cx+w/2,base-h);g.lineTo(cx,base-h+w*.22);g.lineTo(cx,base);g.lineTo(cx+w/2,base-w*.22);g.closePath();g.fill();
 g.fillStyle=roof;g.beginPath();g.moveTo(cx,base-h-w*.22);g.lineTo(cx+w/2,base-h);g.lineTo(cx,base-h+w*.22);g.lineTo(cx-w/2,base-h);g.closePath();g.fill();g.strokeStyle="#302b24";g.stroke()
}
function building(b){let p=pos(b.x,b.y),t=b.type;if(t=="farm"){g.fillStyle="#6b4e2d";g.beginPath();g.moveTo(p.x,p.y-7);g.lineTo(p.x+23,p.y+4);g.lineTo(p.x,p.y+15);g.lineTo(p.x-23,p.y+4);g.closePath();g.fill();for(let i=-15;i<=15;i+=6){g.fillStyle="#66833d";g.fillRect(p.x+i,p.y-5+Math.abs(i)*.18,3,11)}g.strokeStyle="#4d3825";g.strokeRect(p.x-22,p.y-8,44,22)}
 else if(t=="water"){isoBox(p.x,p.y,31,26,"#7d8277","#555d55","#454f49");rect(p.x-9,p.y-45,18,20,"#788c8a");g.fillStyle="#a7c3bd";g.fillRect(p.x-6,p.y-40,12,3);rect(p.x+13,p.y-25,3,23,"#3e4843")}
 else if(t=="canteen"){isoBox(p.x,p.y,42,27,"#8d6b47","#7c523b","#5e4034");g.fillStyle="#d5b16b";g.fillRect(p.x-16,p.y-31,29,5);g.fillStyle="#342b21";g.font="bold 6px Arial";g.textAlign="center";g.fillText("CANTEEN",p.x-2,p.y-27);rect(p.x-4,p.y-12,7,13,"#342a23")}
 else {isoBox(p.x,p.y,43,29,"#62675e","#555c52","#414b45");g.fillStyle="#c3a55e";g.fillRect(p.x-15,p.y-34,29,5);g.fillStyle="#30291f";g.font="bold 6px Arial";g.textAlign="center";g.fillText("ARMORY",p.x,p.y-30);rect(p.x-4,p.y-13,8,14,"#292d29")}
 g.fillStyle="#f3e1a8";g.font="bold 7px Arial";g.textAlign="center";g.fillText(defs[t].name.toUpperCase(),p.x,p.y+19)
}
function human(s){let p=screen(s.w),bob=Math.sin((tick+s.phase)/18)*1.2,x=p.x,y=p.y+bob;g.fillStyle="#172018";g.fillRect(x-5,y+6,10,3);let skin=s.i==1?"#d7a07a":"#b98461";rect(x-3,y-12,6,6,skin);let shirt=s.i==0?"#49697a":s.i==1?"#d1ddd0":"#8a6848";rect(x-4,y-6,8,9,shirt);rect(x-4,y+3,3,6,"#303638");rect(x+1,y+3,3,6,"#303638");if(s.i==0){g.fillStyle="#304b5b";g.fillRect(x-4,y-14,8,3)}if(s.mode=="windup"){g.fillStyle="#d8c07b";g.fillRect(x+4,y-5,8,2)}bar(x,y-17,s.hp/s.max,"#75a051");g.fillStyle="#fff0b9";g.font="bold 7px Arial";g.textAlign="center";g.fillText(s.name,x,y+17)}
function zombie(z){let p=screen(z.w),bob=Math.sin((tick+z.phase)/15)*1.5,x=p.x,y=p.y+bob;g.fillStyle="#182018";g.fillRect(x-5,y+6,10,3);rect(x-3,y-12,6,6,"#829160");rect(x-4,y-6,8,9,"#5a5043");rect(x-4,y+3,3,6,"#38392f");rect(x+1,y+3,3,6,"#38392f");g.fillStyle="#4b1515";g.fillRect(x-2,y-10,1,1);g.fillRect(x+1,y-10,1,1);bar(x,y-17,z.hp/z.max,"#aa4b42")}
function bar(x,y,r,col){g.fillStyle="#211f19";g.fillRect(x-11,y,22,4);g.fillStyle=col;g.fillRect(x-10,y+1,20*Math.max(0,r),2)}
function mk(name,job,l,x,y,i){return{name,job,l,w:worldPos(x,y),hp:58+l*8,max:58+l*8,money:140,weapon:weapons[0],mode:"wander",target:null,cool:50+i*45,sat:0,i,phase:i*31,dest:null}}
function spawn(){S.z.push({w:worldPos(Math.random()<.5?2:10,1+Math.floor(Math.random()*3)),hp:25,max:25,cool:45,phase:Math.random()*100,dest:null})}
function moveW(o,t,s){let dx=t.x-o.w.x,dy=t.y-o.w.y,d=Math.hypot(dx,dy);if(d<s){o.w.x=t.x;o.w.y=t.y;return true}o.w.x+=dx/d*s;o.w.y+=dy/d*s;return false}
function ai(s){if(s.cool>0)s.cool--;if(s.hp<=0){s.w={...gateW()};s.w.y+=45;s.hp=s.max*.6;s.mode="rest";s.cool=180;say(s.name+" was rescued.");return}
 if(s.mode=="rest"){if(s.cool<=0){s.hp=s.max;s.mode="wander";s.cool=40}return}
 if(s.mode=="wander"){if(!s.dest||s.cool<=0){let x=2+Math.random()*8,y=7+Math.random()*6;s.dest=worldPos(x,y);s.cool=90+Math.random()*120}if(s.dest)moveW(s,s.dest,.28);if(s.cool<35){let z=S.z.find(z=>z.hp>0);if(z){s.target=z;s.mode="chase"}}return}
 if(s.mode=="chase"&&s.target&&s.target.hp>0){if(Math.hypot(s.w.x-s.target.w.x,s.w.y-s.target.w.y)>20)moveW(s,s.target.w,.45);else{s.mode="windup";s.cool=34}return}
 if(s.mode=="windup"){if(s.cool<=0){let z=s.target;if(z&&z.hp>0){let dmg=Math.round(5+s.weapon[1]*.5);z.hp-=dmg;floats.push({w:{...z.w},t:"-"+dmg,col:"#ffe08a",a:65});if(z.hp<=0){S.kills++;s.money+=18;S.money+=4;S.ren++;s.mode="return";s.target=null;say(s.name+" defeated a Walker!");if(S.stage==1&&S.kills>=3){S.stage=2;S.ren+=10;say("Goal complete! Renown +10")}ui();return}}s.mode="recover";s.cool=55}return}
 if(s.mode=="recover"){if(s.cool<=0)s.mode="chase";return}
 if(s.mode=="return"){let q=gateW();q={x:q.x,y:q.y+50};if(moveW(s,q,.48)){s.mode="shop";s.cool=55}return}
 if(s.mode=="shop"){if(s.cool>0)return;let a=S.b.find(b=>b.type=="armory");if(a){let q=worldPos(a.x+.5,a.y+.5);if(!moveW(s,q,.4))return;upgrade(s,a)}s.mode="wander";s.cool=80}
}
function zai(z){z.cool=Math.max(0,z.cool-1);if(!z.dest||Math.random()<.004){z.dest={x:z.w.x+(Math.random()-.5)*35,y:z.w.y+(Math.random()-.5)*18}}if(z.dest)moveW(z,z.dest,.08);let s=S.sv.find(s=>["chase","windup","recover"].includes(s.mode)&&s.target===z&&Math.hypot(s.w.x-z.w.x,s.w.y-z.w.y)<21);if(s&&z.cool<=0){s.hp-=4;floats.push({w:{...s.w},t:"-4",col:"#ff7568",a:65});z.cool=80}}
function upgrade(s,a){let max=a.q<20?14:a.q<40?19:24,opts=weapons.filter(w=>w[1]<=max&&w[1]>=s.weapon[1]*1.15&&w[2]<=s.money);if(!opts.length)return;let w=opts.at(-1);s.money-=w[2];S.money+=w[2];s.weapon=w;s.sat+=2;a.q++;say(s.name+" bought "+w[0]+"!")}
function init(){S.b=[{type:"canteen",x:4,y:9,q:10,a:10}];S.sv=[mk("Marcus","Guard",3,6,9,0),mk("Amy","Medic",2,7,10,1),mk("Lena","Scavenger",2,5,11,2)];spawn();spawn();Object.entries(defs).forEach(([k,d])=>{let b=document.createElement("button");b.className="build";b.innerHTML=`${d.name}<small>$${d.cost} · PARTS ${d.mat}</small>`;b.onclick=()=>{sel=k;closeP();say("Tap a highlighted lot for "+d.name)};buildGrid.appendChild(b)});ui()}
function closeP(){buildPanel.style.display=infoPanel.style.display="none"}function showBuild(){closeP();buildPanel.style.display="block"}function say(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(window.to);window.to=setTimeout(()=>toast.style.opacity=0,1700)}
c.onpointerdown=e=>{drag={on:true,x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};c.setPointerCapture(e.pointerId)}
c.onpointermove=e=>{if(!drag.on)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)drag.moved=true;if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy}}
c.onpointerup=e=>{if(!drag.on)return;drag.on=false;if(drag.moved)return;let r=c.getBoundingClientRect(),t=inv(e.clientX-r.left,e.clientY-r.top);if(sel){if(!valid(t.x,t.y)){say("That lot is unavailable.");return}let d=defs[sel];if(S.money<d.cost||S.mat<d.mat){say("Not enough resources.");return}S.money-=d.cost;S.mat-=d.mat;S.b.push({type:sel,x:t.x,y:t.y,q:d.q,a:d.a});if(sel=="water"&&S.stage==0){S.stage=1;S.ren+=5}say(d.name+" constructed!");sel=null;ui();return}let b=S.b.find(b=>b.x==t.x&&b.y==t.y);if(b){let d=defs[b.type];it.textContent=d.name.toUpperCase();ib.innerHTML=`Quality: <b>${b.q}</b><br>Appeal: <b>${b.a}</b><br><br>Original isometric facility art. Survivors visit automatically.`;infoPanel.style.display="block"}}
function showSurvivors(){closeP();it.textContent="SURVIVORS";ib.innerHTML=S.sv.map(s=>`<b>${s.name}</b> · ${s.job} Lv.${s.l}<br>HP ${Math.ceil(s.hp)}/${s.max} · $${s.money} · ${s.weapon[0]} (${s.weapon[1]})`).join("<hr>");infoPanel.style.display="block"}function showItems(){closeP();it.textContent="ITEMS";ib.innerHTML="Equipment and investment items expand in later builds.";infoPanel.style.display="block"}function showGuide(){closeP();it.textContent="V0.4 GUIDE";ib.innerHTML="Drag anywhere on the world to pan. Terrain, buildings, survivors, Walkers, scenery and damage text now share one camera. Tap without dragging to build/select. Combat has wind-up and recovery delays.";infoPanel.style.display="block"}
function ui(){money.textContent=S.money;food.textContent=S.food;water.textContent=S.water;mat.textContent=S.mat;ren.textContent=S.ren;clock.textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:00`;qt.textContent=S.stage==0?"Build a Water Collector (0/1)":S.stage==1?`Defeat 3 Walkers (${Math.min(S.kills,3)}/3)`:"V0.4 goal complete — grow the Haven!"}
function draw(){g.clearRect(0,0,W,H);g.fillStyle="#273326";g.fillRect(0,0,W,H);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let outside=y<6;diamond(x,y,outside?((x+y)%2?"#5f5b4e":"#676052"):((x+y)%2?"#536644":"#5a6d49"))}for(let x=0;x<COLS;x++){diamond(x,2,"#57574f");diamond(x,3,"#5d5b51")}for(let x=0;x<COLS;x+=2){let p=pos(x,2.2);g.fillStyle="#a0936c";g.fillRect(p.x-6,p.y-1,12,2)}
 // details all camera transformed
 [[1,1],[11,.5],[.8,8],[11.5,10],[2,13]].forEach(a=>{let p=pos(...a);tree(p.x,p.y)});[[2,1.7],[10,3.8],[1.5,11],[9,13]].forEach(a=>{let p=pos(...a);rubble(p.x,p.y)});[[3,8],[8,11]].forEach(a=>{let p=pos(...a);crate(p.x,p.y)});[[3.5,8.2],[8.4,11.2]].forEach(a=>{let p=pos(...a);barrel(p.x,p.y)});
 for(let x=0;x<COLS;x++){if(x==6)continue;let a=pos(x,5.5),b=pos(x+.85,5.5);g.strokeStyle="#35372d";g.lineWidth=3;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();rect(a.x-1,a.y-8,3,12,"#5e5945")}let gt=screen(gateW());g.fillStyle="#e8d49e";g.font="bold 7px Arial";g.textAlign="center";g.fillText("HAVEN GATE",gt.x,gt.y-12);
 if(sel){g.globalAlpha=.35;for(let y=6;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(valid(x,y))diamond(x,y,"#e4d25f","#8d8139");g.globalAlpha=1}
 let things=[];S.b.forEach(b=>things.push({y:pos(b.x,b.y).y,fn:()=>building(b)}));S.z.forEach(z=>things.push({y:screen(z.w).y,fn:()=>zombie(z)}));S.sv.forEach(s=>things.push({y:screen(s.w).y,fn:()=>human(s)}));things.sort((a,b)=>a.y-b.y).forEach(o=>o.fn());
 for(let f of floats){let p=screen(f.w);g.globalAlpha=Math.min(1,f.a/20);g.fillStyle=f.col;g.font="bold 10px Arial";g.fillText(f.t,p.x,p.y-22-(65-f.a)*.22);g.globalAlpha=1}for(let i=floats.length-1;i>=0;i--)if(--floats[i].a<=0)floats.splice(i,1)
}
function loop(){tick++;S.sv.forEach(ai);S.z.forEach(zai);S.z=S.z.filter(z=>z.hp>0);if(S.z.length<2&&tick%220==0)spawn();if(tick%1000==0){S.hour++;if(S.hour>=24){S.hour=0;S.day++;S.b.forEach(b=>{if(b.type=="farm")S.food+=3;if(b.type=="water")S.water+=4});S.food=Math.max(0,S.food-S.sv.length);S.water=Math.max(0,S.water-S.sv.length)}ui()}draw();requestAnimationFrame(loop)}init();requestAnimationFrame(loop);
</script></body></html>
